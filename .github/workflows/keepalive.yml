name: Supabase keepalive

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "URL length: $(printf '%s' "$SUPABASE_URL" | wc -c)"
          echo "KEY length: $(printf '%s' "$SUPABASE_KEY" | wc -c)"
          echo "URL head: $(printf '%s' "$SUPABASE_URL" | head -c 8)"
          echo "KEY head: $(printf '%s' "$SUPABASE_KEY" | head -c 15)"
          echo "---"
          echo "Try 1: apikey only"
          curl -s -o /tmp/r1.txt -w "HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_KEY"
          echo "Body: $(head -c 200 /tmp/r1.txt)"
          echo "---"
          echo "Try 2: Bearer only"
          curl -s -o /tmp/r2.txt -w "HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/" -H "Authorization: Bearer $SUPABASE_KEY"
          echo "Body: $(head -c 200 /tmp/r2.txt)"
